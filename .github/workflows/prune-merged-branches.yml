name: Prune safely merged branches
on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Remove only fully merged unchanged same-repository branches
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse,urllib.error
          repo=os.environ['GH_REPOSITORY']
          token=os.environ['GH_TOKEN']
          root='https://api.github.com/repos/'+repo
          def api(path,method='GET'):
              url=root+path
              request=urllib.request.Request(url,headers={
                'Authorization':'Bearer '+token,
                'Accept':'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28'},method=method)
              with urllib.request.urlopen(request,timeout=30) as response:
                  data=response.read()
                  return json.loads(data) if data else None
          def pages(path):
              result=[]
              for page in range(1,21):
                  separator='&' if '?' in path else '?'
                  values=api(path+separator+'per_page=100&page='+str(page))
                  if not isinstance(values,list):raise RuntimeError('Unexpected GitHub API payload')
                  result.extend(values)
                  if len(values)<100:break
              return result
          repo_info=api('')
          default=repo_info['default_branch']
          merged=pages('/pulls?state=closed')
          open_prs=pages('/pulls?state=open')
          branches=pages('/branches')
          for branch in branches:
              name=branch['name']
              if name in (default,'main','master') or branch.get('protected'):
                  continue
              sha=branch['commit']['sha']
              if any(p['head']['ref']==name and p['head'].get('repo',{}).get('full_name')==repo for p in open_prs):
                  print('KEEP open PR:',name)
                  continue
              matches=[p for p in merged if p.get('merged_at') and
                  p['base']['ref']==default and p['head']['ref']==name and
                  (p['head'].get('repo') or {}).get('full_name')==repo and
                  p['head']['sha']==sha]
              if not matches:
                  print('KEEP unverified or changed branch:',name)
                  continue
              ref='/git/refs/heads/'+urllib.parse.quote(name,safe='/')
              api(ref,'DELETE')
              print('DELETED safely merged branch:',name)
          PY

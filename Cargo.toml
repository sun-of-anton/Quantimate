[package]
name = "quantimate"
version = "0.2.0"
edition = "2021"
description = "Photo-first open-source property damage estimating MVP with local pricing intelligence"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.7", features = ["multipart", "json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
csv = "1.3"

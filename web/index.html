<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quantimate — Property Estimating</title>
<style>
:root{font:15px system-ui,Segoe UI,sans-serif;color:#e4edfb;background:#0b1220}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;background:#347eec;color:white;padding:10px 15px;cursor:pointer}button.secondary{background:#25354e}button.danger{background:#633042}input,select,textarea{background:#121f32;border:1px solid #3c4d66;color:#e4edfb;border-radius:7px;padding:9px;max-width:100%}input[type=file]{width:100%}textarea{width:100%;min-height:85px}a{color:#8bc0ff}h1,h2,h3{margin:0 0 12px}p,small{color:#a4b6ce}header{background:#0e192a;border-bottom:1px solid #304056;padding:19px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}header h1{margin:0;font-size:24px}header h1 b{color:#67b7ff}main{max-width:1400px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{background:#132034;border:1px solid #31445e;border-radius:13px;padding:19px;margin-bottom:15px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex-shrink:0}label{color:#b5c6dc;font-size:13px}form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}form>label{display:flex;flex-direction:column;gap:5px}table{border-collapse:collapse;width:100%;margin:10px 0;min-width:620px;font-size:13px}th,td{text-align:left;border-bottom:1px solid #304056;padding:10px 6px;vertical-align:top}th{color:#9db6d5}.tablewrap{overflow:auto}.photo{max-width:175px;max-height:125px;object-fit:cover;border-radius:8px}.photos{display:flex;gap:10px;flex-wrap:wrap}.notice{border:1px solid #805f3d;border-radius:8px;padding:12px;background:#352917;color:#ffdca7;margin:10px 0}.muted{font-size:13px;color:#a3b4cc}.hide{display:none}#toast{position:fixed;bottom:20px;right:20px;background:#29415d;border:1px solid #5184b4;border-radius:8px;padding:12px;max-width:400px;display:none}.badge{background:#1d3856;border-radius:16px;padding:4px 9px;color:#a5ccfa;font-size:12px}@media print{header,form,button,input,textarea,.notice{display:none!important}.card{background:white;color:black;border:1px solid #bbb}body{background:white;color:black}p,small,td,th{color:black}} 
</style></head>
<body><header><h1>◇ Quanti<b>mate</b></h1><div class="row"><button class="secondary" onclick="navigate('inspections')">Inspections</button><button class="secondary" onclick="navigate('prices')">Price intelligence</button><button class="secondary" onclick="exportCurrent()">Export JSON</button><button class="secondary" onclick="window.print()">Print / PDF</button></div></header>
<main><div class="notice">Experimental estimating prototype. Measurements, damage findings and all prices require professional verification. AI photo analysis transmits selected evidence to your configured provider.</div><div id="app"></div></main><div id="toast"></div>
<script>
let projects=[], current=null, view='inspections', detail=null, quotes=[],recipes=[];
const el=id=>document.getElementById(id);
const clean=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v)||0);
const formval=(f,k)=>new FormData(f).get(k);
function toast(s){const x=el('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',4500)}
async function api(url,opts){const r=await fetch(url,opts);let x=await r.text();try{x=JSON.parse(x)}catch{}if(!r.ok)throw Error(typeof x==='string'?x:JSON.stringify(x));return x}
const send=(url,obj)=>api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
function action(fn){return async(...args)=>{try{await fn(...args)}catch(e){toast(e.message)}}}
async function navigate(v){view=v;await refresh()}
async function openProject(id){view='inspections';current=id;await refresh()}
async function refresh(){try{projects=await api('/api/projects');if(!current&&projects.length)current=projects[0].id;if(view==='prices'){[quotes,recipes]=await Promise.all([api('/api/prices'),api('/api/assemblies')]);showPrices();return;}detail=current?await api('/api/projects/'+current):null;showInspections()}catch(e){toast(e.message)}}
function showInspections(){
 let h='<div class="grid"><section class="card"><h2>Inspections</h2><form onsubmit="createProject(event)"><label>Property / claim name<input name="name" required placeholder="Kitchen water loss"></label><label>Address<input name="address" placeholder="Optional"></label><label>Loss type<select name="loss_type"><option>water</option><option>fire</option><option>wind</option><option>other</option></select></label><button>Create</button></form><hr>';
 h+=projects.map(p=>'<button class="'+(current===p.id?'':'secondary')+'" onclick="openProject(&quot;'+p.id+'&quot;)">'+clean(p.name)+'</button> ').join('')+'</section>';
 if(!detail){el('app').innerHTML=h+'</div>';return;}
 h+='<section class="card"><h2>'+clean(detail.project.name)+'</h2><div class="muted">'+clean(detail.project.address)+' · '+clean(detail.project.loss_type)+'</div><h1>'+usd(detail.subtotal)+'</h1><small>Subtotal before taxes, depreciation and overhead/profit</small></section></div>';
 h+='<section class="card"><h2>Add measured room</h2><form onsubmit="createRoom(event)"><label>Name<input name="name" required placeholder="Kitchen"></label><label>Length ft<input name="length_ft" type="number" step=".01" min=".01" required></label><label>Width ft<input name="width_ft" type="number" step=".01" min=".01" required></label><label>Height ft<input name="height_ft" type="number" step=".01" min=".01" required></label><button>Add room</button></form></section>';
 for(const r of detail.rooms){
  h+='<section class="card"><h2>'+clean(r.name)+'</h2><p>Measured floor '+r.floor_sf.toFixed(1)+' SF · gross walls '+r.wall_sf.toFixed(1)+' SF (does not deduct openings)</p>';
  h+='<div class="photos">'+r.photos.map(p=>'<a href="/uploads/'+encodeURIComponent(p.filename)+'" target="_blank"><img class="photo" alt="Damage evidence" src="/uploads/'+encodeURIComponent(p.filename)+'"></a>').join('')+'</div>';
  h+='<form onsubmit="uploadPhotos(event,&quot;'+r.id+'&quot;)"><label>Upload JPEG/PNG/WebP photos<input name="photos" type="file" multiple accept="image/jpeg,image/png,image/webp" required></label><button>Upload evidence</button></form>';
  h+='<div class="grid"><div><h3>Repair scope</h3><form onsubmit="addLine(event,&quot;'+r.id+'&quot;)"><label>Activity<input name="description" required placeholder="Remove damaged drywall"></label><label>Category<input name="category" value="General"></label><label>Qty<input type="number" step=".001" min="0" name="quantity" required></label><label>Unit<input name="unit" value="SF"></label><label>Unit price<input type="number" step=".0001" min="0" name="unit_price" required></label><label>Pricing source<input name="source" placeholder="Quote / invoice"></label><button>Add line</button></form><div class="row"><button class="secondary" onclick="assembly(&quot;'+r.id+'&quot;)">Price from assembly</button></div></div>';
  h+='<div><h3>AI photo assessment</h3><p>Model suggestions require confirmation. No AI items are added automatically.</p><textarea id="notes-'+r.id+'" placeholder="Observed damage, moisture readings, limits of inspection"></textarea><br><button onclick="analyze(&quot;'+r.id+'&quot;)">Analyze evidence</button>';
  if(r.analyses.length){let suggestions=[];try{suggestions=JSON.parse(r.analyses[0].proposals)}catch{}h+=suggestions.map((p,i)=>'<div class="card"><b>'+clean(p.description)+'</b><p>'+clean(p.rationale)+'<br>Confidence: '+clean(p.confidence)+'</p><button class="secondary" onclick="accept(&quot;'+r.id+'&quot;,'+i+')">Review and price</button></div>').join('')}
  h+='</div></div><div class="tablewrap"><table><thead><tr><th>Activity</th><th>Category</th><th>Qty</th><th>Unit</th><th>Unit price</th><th>Line total</th><th>Source</th><th></th></tr></thead><tbody>';
  h+=r.lines.map(l=>'<tr><td>'+clean(l.description)+'</td><td>'+clean(l.category)+'</td><td>'+l.quantity+'</td><td>'+clean(l.unit)+'</td><td>'+usd(l.unit_price)+'</td><td>'+usd(l.total)+'</td><td><details><summary>Provenance</summary><small>'+clean(l.source)+'</small></details></td><td><button class="danger" onclick="removeLine(&quot;'+l.id+'&quot;)">×</button></td></tr>').join('');
  h+='</tbody></table></div></section>';
 }
 el('app').innerHTML=h;
}
function showPrices(){
 let h='<section class="card"><h2>Price intelligence</h2><p>Import only observations you have permission to store and use. This prototype does not crawl retailer websites.</p><form onsubmit="importPrices(event)"><label>Pricing CSV<input name="file" type="file" accept=".csv" required></label><button>Import sourced observations</button></form><small>Required CSV fields: item_key, description, component_type, unit, package_price, package_quantity, zip_code, supplier, sku, observed_at, source_url, rights_note.</small></section>';
 h+='<section class="card"><h2>Recorded quotes ('+quotes.length+')</h2><form onsubmit="searchPrices(event)"><label>Exact ZIP<input name="zip" maxlength="5" placeholder="00000"></label><label>Item search<input name="search"></label><button>Filter</button></form><div class="tablewrap"><table><thead><tr><th>Item</th><th>Supplier</th><th>ZIP</th><th>Normalized unit price</th><th>Observed</th><th>Rights</th></tr></thead><tbody>';
 h+=quotes.map(p=>'<tr><td>'+clean(p.description)+'<br><small>'+clean(p.item_key)+'</small></td><td>'+clean(p.supplier)+' / '+clean(p.sku)+'</td><td>'+clean(p.zip_code)+'</td><td>'+usd(p.unit_cost)+' / '+clean(p.unit)+'</td><td>'+clean(p.observed_at)+'</td><td>'+clean(p.rights_note)+'</td></tr>').join('');h+='</tbody></table></div></section>';
 h+='<section class="card"><h2>Available repair assemblies</h2>'+recipes.map(a=>'<div><b>'+clean(a.label)+'</b><p>'+clean(a.notes)+'</p></div>').join('')+'</section>';el('app').innerHTML=h;
}
async function createProject(e){e.preventDefault();const f=e.target,p=await send('/api/projects',{name:formval(f,'name'),address:formval(f,'address'),loss_type:formval(f,'loss_type')});current=p.id;await refresh()}
async function createRoom(e){e.preventDefault();const f=e.target;await send('/api/projects/'+current+'/rooms',{name:formval(f,'name'),length_ft:Number(formval(f,'length_ft')),width_ft:Number(formval(f,'width_ft')),height_ft:Number(formval(f,'height_ft'))});await refresh()}
async function uploadPhotos(e,id){e.preventDefault();const f=e.target,fd=new FormData();for(const file of f.querySelector('[name=photos]').files)fd.append('photos',file);const r=await api('/api/rooms/'+id+'/photos',{method:'POST',body:fd});toast('Uploaded '+r.uploaded+' photographs');await refresh()}
async function addLine(e,id){e.preventDefault();const f=e.target;await send('/api/rooms/'+id+'/lines',{description:formval(f,'description'),category:formval(f,'category'),quantity:Number(formval(f,'quantity')),unit:formval(f,'unit'),unit_price:Number(formval(f,'unit_price')),source:formval(f,'source')});await refresh()}
async function removeLine(id){if(!confirm('Remove line item?'))return;await api('/api/lines/'+id,{method:'DELETE'});await refresh()}
async function analyze(id){const notes=el('notes-'+id).value;const r=await send('/api/rooms/'+id+'/analyze',{notes});toast('Received '+r.proposals.length+' AI scope proposals');await refresh()}
async function accept(id,i){const r=detail.rooms.find(x=>x.id===id);const p=JSON.parse(r.analyses[0].proposals)[i];const quantity=Number(prompt('Field-verified quantity',p.quantity||'0'));const unit_price=Number(prompt('Verified unit price, USD','0'));if(!Number.isFinite(quantity)||quantity<0||!Number.isFinite(unit_price)||unit_price<0)return toast('Invalid values');await send('/api/rooms/'+id+'/lines',{description:p.description,category:p.category,quantity,unit:p.unit||'EA',unit_price,source:'Manually reviewed AI scope: '+p.evidence});await refresh()}
async function assembly(id){if(!recipes.length)recipes=await api('/api/assemblies');const chosen=prompt('Assembly ID:\n'+recipes.map(a=>a.id+' — '+a.label).join('\n'),recipes[0]?.id);if(!chosen)return;const zip=prompt('Five-digit ZIP (synthetic sample uses 00000)','00000');const quantity=Number(prompt('Verified quantity','100'));const payload={assembly_id:chosen,zip_code:zip,quantity};const p=await send('/api/rooms/'+id+'/assembly/preview',payload);const parts=p.components.map(c=>c.item_key+': '+c.units_per_output+' '+c.unit+' × '+usd(c.unit_price)+' ('+c.supplier+')').join('\n');if(!confirm(p.label+'\n'+quantity+' '+p.output_unit+' @ '+usd(p.unit_price)+' = '+usd(p.line_total)+'\n\n'+parts+'\n\nAdd reviewed snapshot?'))return;await send('/api/rooms/'+id+'/assembly/line',payload);await refresh()}
async function importPrices(e){e.preventDefault();const fd=new FormData();fd.append('file',e.target.querySelector('[name=file]').files[0]);const r=await api('/api/prices/import',{method:'POST',body:fd});toast('Imported '+r.imported+' source observations');await refresh()}
async function searchPrices(e){e.preventDefault();const f=e.target;quotes=await api('/api/prices?zip='+encodeURIComponent(formval(f,'zip'))+'&search='+encodeURIComponent(formval(f,'search')));showPrices()}
function exportCurrent(){if(!detail)return toast('Select an inspection first');const b=new Blob([JSON.stringify({...detail,export_warning:'Preliminary, unverified estimate'},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='quantimate-inspection.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
window.addEventListener('unhandledrejection',e=>{toast(e.reason?.message||'Request failed');e.preventDefault()});refresh();
</script></body></html>
